<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestión de Feriantes · Euca & Plate</title>
<style>
:root{--bg:#f5f3ee;--card:#fff;--ink:#25302b;--muted:#6d756f;--green:#476b55;--green2:#dfe9e2;--orange:#c77845;--line:#e5e1d8;--red:#b85454;--blue:#4e708a;--shadow:0 8px 25px #27352a12}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.app{display:flex;min-height:100vh}.side{width:245px;background:#24352c;color:white;padding:22px 16px;position:sticky;top:0;height:100vh}.brand{font-size:20px;font-weight:800;margin:5px 8px 25px}.brand span{color:#d7b38d}.nav button{width:100%;text-align:left;background:transparent;color:#dfe8e2;padding:12px 13px;border-radius:10px;margin:3px 0}.nav button.active,.nav button:hover{background:#ffffff14}.main{flex:1;padding:28px;max-width:1500px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.title h1{margin:0;font-size:29px}.title p{margin:5px 0;color:var(--muted)}.btn{padding:10px 14px;border-radius:9px;background:var(--green);color:#fff;font-weight:700}.btn.alt{background:#fff;color:var(--green);border:1px solid #ccd8cf}.btn.red{background:var(--red)}.btn.small{padding:7px 10px;font-size:13px}.grid{display:grid;gap:16px}.cards{grid-template-columns:repeat(4,minmax(0,1fr))}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:18px;box-shadow:var(--shadow)}.metric{font-size:28px;font-weight:800;margin-top:7px}.muted{color:var(--muted);font-size:13px}.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}.search{flex:1;min-width:220px}.input{width:100%;padding:10px 11px;border:1px solid #d8d5cc;border-radius:9px;background:#fff;outline:none}.input:focus{border-color:var(--green)}table{width:100%;border-collapse:collapse}.tablewrap{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:auto;box-shadow:var(--shadow)}th,td{padding:12px 13px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}th{background:#faf9f6;color:#69716c;font-size:12px;text-transform:uppercase;letter-spacing:.04em}tr:last-child td{border-bottom:0}.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:700}.euca{background:#e4efe6;color:#356047}.plate{background:#eee7f2;color:#6b4b79}.done{background:#e4efe6;color:#356047}.susp{background:#f7e3e3;color:#984444}.pend{background:#eee;color:#666}.modal{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal.show{display:flex}.modalbox{background:#fff;border-radius:17px;width:min(900px,100%);max-height:92vh;overflow:auto;padding:22px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field label{display:block;font-size:12px;font-weight:700;color:#626a65;margin-bottom:5px}.field.full{grid-column:1/-1}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}.profile{display:grid;grid-template-columns:280px 1fr;gap:18px}.profilebox{background:#fff;border:1px solid var(--line);border-radius:15px;padding:18px}.tabs{display:flex;gap:6px;margin:15px 0}.tabs button{background:#eeeae2;padding:9px 12px;border-radius:8px}.tabs button.active{background:var(--green);color:#fff}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.calhead{text-align:center;font-size:12px;color:var(--muted);font-weight:700}.day{min-height:125px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px}.daynum{font-weight:800;font-size:13px}.event{font-size:11px;padding:5px 6px;border-radius:7px;margin-top:5px;line-height:1.2}.event.e{background:#e4efe6}.event.p{background:#eee7f2}.empty{color:#aaa}.section{margin-top:18px}.section h2{font-size:18px;margin:0 0 10px}.right{margin-left:auto}.hidden{display:none!important}.module-board{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}.module{width:360px;background:#fff;border:2px dashed #cfd8d1;border-radius:16px;padding:14px;box-shadow:var(--shadow)}.module.dragover{border-color:var(--green);background:#f4faf5}.modulehead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.slot{min-height:74px;border:1px solid var(--line);border-radius:10px;padding:7px;background:#faf9f6;font-size:11px;display:flex;flex-direction:column;justify-content:center;cursor:grab}.slot.empty{color:#aaa;border-style:dashed}.slot.dragging{opacity:.45}.moduletools{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.fairsummary{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.checklist{display:grid;gap:8px}.checkrow{display:flex;align-items:center;gap:8px;padding:8px;border:1px solid var(--line);border-radius:8px}.creditnote{font-size:12px;color:#356047}.foldertag{background:#eef2f6;color:#4e708a}.attended{background:#e4efe6;color:#356047}.absent{background:#f7e3e3;color:#984444}.notice{padding:11px 13px;border-radius:10px;background:#fff6e8;border:1px solid #eed8b8;color:#74552d;font-size:13px;margin-bottom:14px}
@media(max-width:900px){.side{width:70px;padding:15px 8px}.brand{font-size:0}.brand:after{content:"F";font-size:22px}.nav button{font-size:0;text-align:center}.nav button::first-letter{font-size:18px}.cards{grid-template-columns:1fr 1fr}.profile{grid-template-columns:1fr}.calendar{grid-template-columns:repeat(7,minmax(85px,1fr));overflow:auto}.main{padding:18px}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
  <div class="brand">Feria <span>Manager</span></div>
  <div class="nav">
    <button class="active" data-view="dashboard">🏠 Inicio</button>
    <button data-view="vendors">👥 Feriantes</button>
    <button data-view="agenda">📒 Agenda</button>
    <button data-view="fairs">📅 Ferias</button>
    <button data-view="calendar">🗓️ Calendario</button>
    <button data-view="modules">🧩 Módulos</button>
    <button data-view="backup">💾 Respaldo</button>
  </div>
</aside>
<main class="main">
  <div id="app"></div>
</main>
</div>

<div class="modal" id="modal"><div class="modalbox" id="modalbox"></div></div>

<script>
const KEY='feria_manager_v1';
const seed={
 vendors:[{"id": "seed-1", "name": "Veronica Martinez", "permit": "2059", "member": "T-285659", "business": "La Chica de los Buzos", "balance": 0, "payments": [], "participations": [], "docs": []}, {"id": "seed-2", "name": "María Alejandra Lovaine", "permit": "2283", "member": "368056", "business": "Ohlulu home", "balance": 0, "payments": [], "participations": [], "docs": []}, {"id": "seed-3", "name": "Mariana Cotroneo", "permit": "1328", "member": "153044", "business": "Hilando sueños", "balance": 0, "payments": [], "participations": [], "docs": [], "note": "En el mensaje figura además Nro de socio 1328 y número de inscripción al club 153044."}, {"id": "seed-4", "name": "Analía Soledad Orliacq", "permit": "2020", "member": "A-288276", "business": "Bella Luz", "balance": 0, "payments": [], "participations": [], "docs": [], "note": "Seres mágicos y aromas especiales"}, {"id": "seed-5", "name": "Sabrina Paolisso", "permit": "2483", "member": "A-481564", "business": "Le toille aromas", "balance": 0, "payments": [], "participations": [], "docs": [], "note": "Holística - aromaterapia"}, {"id": "seed-6", "name": "Liliana Pavone", "permit": "1699", "member": "T-151826", "business": "Corazón de Tiza", "balance": 0, "payments": [], "participations": [], "docs": []}, {"id": "seed-7", "name": "Elizabeth Mercedes Ramos", "permit": "2525", "member": "A-494947", "business": "Espacio Bioletta", "balance": 0, "payments": [], "participations": [], "docs": []}, {"id": "seed-8", "name": "Vanina Giuseppucci", "permit": "2392", "member": "A-445363", "business": "De Pixel A Pieza", "balance": 0, "payments": [], "participations": [], "docs": []}, {"id": "seed-9", "name": "Silvia Polizzi", "permit": "2296", "member": "A-363940", "business": "Sinplu", "balance": 0, "payments": [], "participations": [], "docs": []}, {"id": "seed-10", "name": "Lorena Finelli", "permit": "1728", "member": "A-152582", "business": "Meraki by lola", "balance": 0, "payments": [], "participations": [], "docs": []}, {"id": "seed-11", "name": "Daniela Paula Sánchez", "permit": "2173", "member": "A-336093", "business": "Kairós, Rincón Mágico", "balance": 0, "payments": [], "participations": [], "docs": []}, {"id": "seed-12", "name": "Patricia Hermida", "permit": "2492", "member": "A-480854", "business": "Boho Spirit BA", "balance": 0, "payments": [], "participations": [], "docs": [], "note": "Ayudante: Graciela Hermida."}, {"id": "seed-13", "name": "Nilda Teresa Burone", "permit": "2186", "member": "", "business": "Desdeelalma.3f", "balance": 0, "payments": [], "participations": [], "docs": []}, {"id": "seed-14", "name": "Antonella Dinatale", "permit": "", "member": "A-214422", "business": "I Choose Violence", "balance": 0, "payments": [], "participations": [], "docs": []}, {"id": "seed-15", "name": "Myriam", "permit": "", "member": "1856", "business": "La Tucu gastronomía", "balance": 0, "payments": [], "participations": [], "docs": []}, {"id": "seed-16", "name": "Micaela Giuseppucci", "permit": "", "member": "A-474219", "business": "Glitter Diseños", "balance": 0, "payments": [], "participations": [], "docs": []}, {"id": "seed-17", "name": "Jesús Morales", "permit": "", "member": "A-487589", "business": "Montecristo accesorios", "balance": 0, "payments": [], "participations": [], "docs": []}],
 fairs:[]
};
let db=JSON.parse(localStorage.getItem(KEY)||'null')||seed;
let view='dashboard', month=new Date(2026,7,1);

function save(){localStorage.setItem(KEY,JSON.stringify(db));localStorage.setItem(KEY+'_saved',new Date().toLocaleString('es-AR'));}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function money(n){return '$ '+Number(n||0).toLocaleString('es-AR',{minimumFractionDigits:2});}
function fmtDate(s){if(!s)return '-'; let [y,m,d]=s.split('-'); return `${d}/${m}/${y}`;}
function iso(d){return d.toISOString().slice(0,10);}
function show(v){view=v;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));render();}
function render(){let el=document.getElementById('app'); if(view==='dashboard')el.innerHTML=dashboard(); if(view==='vendors')el.innerHTML=vendors(); if(view==='agenda')el.innerHTML=agenda(); if(view==='fairs')el.innerHTML=fairs(); if(view==='calendar')el.innerHTML=calendar(); if(view==='modules')el.innerHTML=modules(); if(view==='backup')el.innerHTML=backup();}

function dashboard(){
 let today=iso(new Date()), upcoming=db.fairs.filter(f=>f.date>=today).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,6);
 let credits=db.vendors.reduce((a,v)=>a+Number(v.balance||0),0);
 let paidTotal=db.fairs.reduce((a,f)=>a+(f.participants||[]).reduce((s,p)=>s+(p.paid?Number(p.amount||0):0),0),0)+db.vendors.reduce((a,v)=>a+(v.payments||[]).filter(p=>!p.credit).reduce((s,p)=>s+Number(p.amount||0),0),0);
 return `<div class="top"><div class="title"><h1>Gestión de feriantes</h1><p>Euca & Plate · registro y control</p></div><button class="btn" onclick="openVendor()">+ Nuevo feriante</button></div>
 <div class="grid cards">
  <div class="card"><div class="muted">Feriantes registrados</div><div class="metric">${db.vendors.length}</div></div>
  <div class="card"><div class="muted">Ferias cargadas</div><div class="metric">${db.fairs.length}</div></div>
  <div class="card"><div class="muted">Ferias próximas</div><div class="metric">${upcoming.length}</div></div>
  <div class="card"><div class="muted">Pagos cobrados</div><div class="metric">${money(paidTotal)}</div></div>
  <div class="card"><div class="muted">Saldos por ferias suspendidas</div><div class="metric">${money(credits)}</div></div>
 </div>
 <div class="notice">Se cargaron inicialmente <b>17 feriantes</b> con los datos recibidos. Los campos que no fueron informados quedan vacíos para completar después.</div>
 <div class="section"><h2>Próximas ferias</h2><div class="tablewrap"><table><thead><tr><th>Fecha</th><th>Feria</th><th>Horario</th><th>Estado</th></tr></thead><tbody>
 ${upcoming.map(f=>`<tr><td>${fmtDate(f.date)}</td><td><span class="badge ${f.type==='Euca'?'euca':'plate'}">${esc(f.type)}</span></td><td>${esc(f.time)}</td><td>${statusBadge(f.status)}</td></tr>`).join('')||`<tr><td colspan="4" class="muted">No hay ferias cargadas.</td></tr>`}
 </tbody></table></div></div>`;
}

function vendors(){
 return `<div class="top"><div class="title"><h1>Feriantes</h1><p>Datos, pagos, participaciones y comprobantes</p></div><button class="btn" onclick="openVendor()">+ Nuevo feriante</button></div>
 <div class="toolbar"><input id="q" class="input search" placeholder="Buscar por nombre, emprendimiento, permiso o socio…" oninput="filterVendors()"><button class="btn alt" onclick="openPDFOptions()">📄 Exportar PDF</button></div>
 <div class="tablewrap"><table><thead><tr><th>Nombre</th><th>Emprendimiento</th><th>Permiso</th><th>Socio club</th><th></th></tr></thead><tbody id="vendorRows">${vendorRows()}</tbody></table></div>`;
}
function vendorRows(){
 return db.vendors.map(v=>`<tr data-text="${esc((v.name+' '+v.business+' '+v.permit+' '+v.member).toLowerCase())}">
 <td><b>${esc(v.name)}</b></td><td>${esc(v.business)}</td><td>${esc(v.permit)}</td><td>${esc(v.member)}</td>
 <td><button class="btn small alt" onclick="openProfile('${v.id}')">Abrir</button> <button class="btn small alt" onclick="openVendor('${v.id}')">Editar</button> <button class="btn small red" onclick="deleteVendor('${v.id}')">Borrar</button></td></tr>`).join('')||`<tr><td colspan="6" class="muted">Todavía no hay feriantes.</td></tr>`;
}
function filterVendors(){let q=document.getElementById('q').value.toLowerCase();document.querySelectorAll('#vendorRows tr').forEach(r=>r.style.display=(r.dataset.text||'').includes(q)?'':'none');}

function openVendor(id){
 let v=id?db.vendors.find(x=>x.id===id):null;
 document.getElementById('modalbox').innerHTML=`<h2>${v?'Editar feriante':'Nuevo feriante'}</h2>
 <form onsubmit="saveVendor(event,'${id||''}')"><div class="formgrid">
 <div class="field"><label>Nombre y apellido</label><input required class="input" name="name" value="${esc(v?.name)}"></div>
 <div class="field"><label>Número de permiso</label><input class="input" name="permit" value="${esc(v?.permit)}"></div>
 <div class="field"><label>Número de socio del club</label><input class="input" name="member" value="${esc(v?.member)}"></div>
 <div class="field"><label>Nombre del emprendimiento</label><input required class="input" name="business" value="${esc(v?.business)}"></div>
 <div class="field"><label>Celular</label><input class="input" name="phone" value="${esc(v?.phone)}" placeholder="+54 9..."></div>
 <div class="field"><label>Instagram</label><input class="input" name="instagram" value="${esc(v?.instagram)}" placeholder="@usuario"></div>
 <div class="field full"><label>Carpeta / categoría de agenda</label><input class="input" name="folder" value="${esc(v?.folder)}" placeholder="Ej: Gastronomía, Artesanías, Indumentaria"></div>
 </div><div class="actions"><button type="button" class="btn alt" onclick="closeModal()">Cancelar</button><button class="btn">Guardar</button></div></form>`;
 document.getElementById('modal').classList.add('show');
}

function deleteVendor(id){
 const v=db.vendors.find(x=>x.id===id);
 if(!v)return;
 if(!confirm('¿Borrar definitivamente a '+v.name+' y toda su ficha?'))return;
 db.vendors=db.vendors.filter(x=>x.id!==id); save(); render();
}

function agenda(){
 const folders=[...new Set(db.vendors.map(v=>(v.folder||'Sin carpeta').trim()||'Sin carpeta'))].sort((a,b)=>a.localeCompare(b));
 return `<div class="top"><div class="title"><h1>Agenda de feriantes</h1><p>Contactos archivados por carpetas, con celular e Instagram.</p></div><button class="btn" onclick="openVendor()">+ Nuevo feriante</button></div>
 <div class="toolbar"><input id="agendaQ" class="input search" placeholder="Buscar contacto, carpeta, celular o Instagram…" oninput="filterAgenda()"></div>
 <div class="grid">${folders.map(folder=>{const items=db.vendors.filter(v=>(v.folder||'Sin carpeta').trim()===folder||(!v.folder&&folder==='Sin carpeta'));return `<div class="card"><h2 style="margin-top:0">📁 ${esc(folder)} <span class="badge foldertag">${items.length}</span></h2><div class="tablewrap"><table><tr><th>Feriante</th><th>Celular</th><th>Instagram</th><th></th></tr>${items.map(v=>`<tr data-agenda="${esc((v.name+' '+v.business+' '+(v.phone||'')+' '+(v.instagram||'')+' '+folder).toLowerCase())}"><td><b>${esc(v.name)}</b><br><span class="muted">${esc(v.business)}</span></td><td>${esc(v.phone||'-')}</td><td>${esc(v.instagram||'-')}</td><td><button class="btn small alt" onclick="openProfile('${v.id}')">Abrir</button></td></tr>`).join('')}</table></div></div>`}).join('')}</div>`;
}
function filterAgenda(){let q=document.getElementById('agendaQ').value.toLowerCase();document.querySelectorAll('[data-agenda]').forEach(r=>r.style.display=(r.dataset.agenda||'').includes(q)?'':'none');}

function backup(){
 return `<div class="top"><div class="title"><h1>Respaldo y transferencia</h1><p>Guardá una copia completa para usarla en otro dispositivo.</p></div></div>
 <div class="grid cards">
 <div class="card"><div class="muted">Feriantes</div><div class="metric">${db.vendors.length}</div></div>
 <div class="card"><div class="muted">Ferias</div><div class="metric">${db.fairs.length}</div></div>
 <div class="card"><div class="muted">Último guardado</div><div class="metric" style="font-size:17px">${localStorage.getItem(KEY+'_saved')||'Sin registrar'}</div></div>
 <div class="card"><div class="muted">Guardado automático</div><div class="metric" style="font-size:17px">✓ Activo</div></div></div>
 <div class="section"><h2>Exportar</h2><div class="card"><p>El respaldo incluye feriantes, pagos, saldos, participaciones, comprobantes registrados y calendario.</p>
 <button class="btn" onclick="downloadBackup()">💾 Descargar respaldo</button>
 <button class="btn alt" onclick="exportVendorsCSV()">📊 CSV</button>
 <button class="btn alt" onclick="exportVendorsPDF()">📄 PDF</button></div></div>
 <div class="section"><h2>Importar respaldo</h2><div class="card"><p class="muted">En otro dispositivo abrí esta misma web y seleccioná el archivo JSON.</p>
 <input type="file" accept=".json" class="input" onchange="importBackup(event)"></div></div>`;
}
function downloadBackup(){
 const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='respaldo-feriantes-euca-plate.json';a.click();
}
function importBackup(e){
 const file=e.target.files[0];if(!file)return;
 const r=new FileReader();
 r.onload=()=>{try{const data=JSON.parse(r.result);
 if(!data||!Array.isArray(data.vendors)||!Array.isArray(data.fairs))throw 0;
 if(!confirm('Esto reemplazará los datos actuales. ¿Continuar?'))return;
 db=data;save();alert('Respaldo importado correctamente.');render();
 }catch(x){alert('El archivo no es un respaldo válido.');}};
 r.readAsText(file);
}
function exportVendorsCSV(){
 const rows=[['Nombre y apellido','Permiso','Socio club','Emprendimiento','Saldo a favor']];
 db.vendors.forEach(v=>rows.push([v.name,v.permit,v.member,v.business,v.balance||0]));
 const csv=rows.map(r=>r.map(x=>`"${String(x??'').replace(/"/g,'""')}"`).join(';')).join('\\n');
 const blob=new Blob(["\\ufeff"+csv],{type:'text/csv;charset=utf-8'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='feriantes-euca-plate.csv';a.click();
}
function openPDFOptions(){
 document.getElementById('modalbox').innerHTML=`<h2>Exportar listado a PDF</h2><p class="muted">Elegí qué datos querés incluir. Por defecto, el saldo queda oculto.</p>
 <div class="checklist">
 <label class="checkrow"><input type="checkbox" name="pdfField" value="name" checked> Nombre y apellido</label>
 <label class="checkrow"><input type="checkbox" name="pdfField" value="business" checked> Emprendimiento</label>
 <label class="checkrow"><input type="checkbox" name="pdfField" value="permit" checked> Número de permiso</label>
 <label class="checkrow"><input type="checkbox" name="pdfField" value="member" checked> Número de socio</label>
 <label class="checkrow"><input type="checkbox" name="pdfField" value="balance"> Saldo a favor</label>
 </div><div class="actions"><button class="btn alt" onclick="closeModal()">Cancelar</button><button class="btn" onclick="exportVendorsPDF([...document.querySelectorAll('[name=pdfField]:checked')].map(x=>x.value))">Generar PDF</button></div>`;
 document.getElementById('modal').classList.add('show');
}
function exportVendorsPDF(fields=['name','business','permit','member']){
 if(!fields.length)return alert('Elegí al menos un dato.');
 const labels={name:'Nombre y apellido',business:'Emprendimiento',permit:'Permiso',member:'Socio',balance:'Saldo a favor'};
 const value=(v,k)=>k==='balance'?money(v.balance):esc(v[k]||'-');
 const rows=db.vendors.map(v=>`<tr>${fields.map(k=>`<td>${value(v,k)}</td>`).join('')}</tr>`).join('');
 const w=window.open('','_blank');
 w.document.write(`<html><head><title>Listado de Feriantes</title><style>body{font-family:Arial;padding:25px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ccc;padding:7px;text-align:left;font-size:12px}th{background:#eee}</style></head><body><h1>Registro de Feriantes · Euca & Plate</h1><p>Generado: ${new Date().toLocaleString('es-AR')}</p><table><tr>${fields.map(k=>`<th>${labels[k]}</th>`).join('')}</tr>${rows}</table><script>window.onload=()=>window.print()<\/script></body></html>`);
 w.document.close();closeModal();
}
function saveVendor(e,id){e.preventDefault();let f=new FormData(e.target);let v={id:id||crypto.randomUUID(),name:f.get('name'),permit:f.get('permit'),member:f.get('member'),business:f.get('business'),phone:f.get('phone'),instagram:f.get('instagram'),folder:f.get('folder'),balance:id?(db.vendors.find(x=>x.id===id).balance||0):0,payments:id?(db.vendors.find(x=>x.id===id).payments||[]):[],participations:id?(db.vendors.find(x=>x.id===id).participations||[]):[],docs:id?(db.vendors.find(x=>x.id===id).docs||[]):[]}; if(id)db.vendors=db.vendors.map(x=>x.id===id?v:x);else db.vendors.push(v);save();closeModal();render();}
function openProfile(id){
 let v=db.vendors.find(x=>x.id===id); if(!v)return;
 document.getElementById('modalbox').innerHTML=`<div class="top"><div><h2 style="margin:0">${esc(v.name)}</h2><div class="muted">${esc(v.business)}</div></div><button class="btn alt" onclick="openVendor('${id}')">Editar</button></div>
 <div class="profile"><div class="profilebox"><b>Datos</b><p><span class="muted">Permiso</span><br>${esc(v.permit||'-')}</p><p><span class="muted">Socio del club</span><br>${esc(v.member||'-')}</p><p><span class="muted">Celular</span><br>${esc(v.phone||'-')}</p><p><span class="muted">Instagram</span><br>${esc(v.instagram||'-')}</p><p><span class="muted">Carpeta</span><br>${esc(v.folder||'Sin carpeta')}</p><p><span class="muted">Saldo a favor</span><br><strong style="font-size:22px">${money(v.balance)}</strong></p></div>
 <div class="profilebox"><div class="tabs"><button class="active" data-tab="pay">Pagos</button><button data-tab="part">Participaciones</button><button data-tab="docs">Comprobantes</button></div><div id="tabcontent">${profileTab(v,'pay')}</div></div></div>`;
 document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById('tabcontent').innerHTML=profileTab(v,b.dataset.tab)});
 document.getElementById('modal').classList.add('show');
}
function profileTab(v,t){
 if(t==='pay')return `<div class="toolbar"><button class="btn small" onclick="addPayment('${v.id}')">+ Registrar pago</button></div><table><tr><th>Fecha</th><th>Concepto</th><th>Monto</th><th>Saldo generado</th></tr>${(v.payments||[]).map(p=>`<tr><td>${fmtDate(p.date)}</td><td>${esc(p.note)}</td><td>${money(p.amount)}</td><td>${p.credit?'Sí':'No'}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">Sin pagos registrados.</td></tr>'}</table>`;
 if(t==='part')return `<div class="toolbar"><button class="btn small" onclick="addParticipation('${v.id}')">+ Registrar participación</button></div><table><tr><th>Feria</th><th>Fecha</th><th>Estado</th><th>Observación</th></tr>${(v.participations||[]).map(p=>`<tr><td>${esc(p.type)}</td><td>${fmtDate(p.date)}</td><td>${statusBadge(p.status)}</td><td>${esc(p.note||'')}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">Sin participaciones.</td></tr>'}</table>`;
 return `<div class="toolbar"><input id="docfile" type="file" class="input"><button class="btn small" onclick="addDoc('${v.id}')">Guardar comprobante</button></div><p class="muted">Los archivos se guardan localmente en este navegador. Para una versión multiusuario conviene conectar una base de datos.</p><table><tr><th>Archivo</th><th>Fecha</th></tr>${(v.docs||[]).map(d=>`<tr><td>📎 ${esc(d.name)}</td><td>${fmtDate(d.date)}</td></tr>`).join('')||'<tr><td colspan="2" class="muted">Sin comprobantes.</td></tr>'}</table>`;
}
function addPayment(id){let amount=prompt('Monto del pago:');if(amount===null)return;amount=Number(amount.replace(',','.'));if(!isFinite(amount))return alert('Monto inválido');let credit=confirm('¿Este pago genera saldo a favor?');let note=prompt('Concepto (ej. Feria Euca 29/08):','Pago de feria')||'';let v=db.vendors.find(x=>x.id===id);v.payments.push({date:iso(new Date()),amount,note,credit});if(credit)v.balance=Number(v.balance||0)+amount;save();openProfile(id);}
function addParticipation(id){let type=prompt('Feria: Euca o Plate','Euca');if(!type)return;let date=prompt('Fecha YYYY-MM-DD',iso(new Date()));if(!date)return;let status=prompt('Estado: realizada / suspendida / pendiente','realizada');let note=prompt('Observación','')||'';let v=db.vendors.find(x=>x.id===id);v.participations.push({type,date,status,note});save();openProfile(id);}
function addDoc(id){let file=document.getElementById('docfile').files[0];if(!file)return alert('Elegí un comprobante.');let v=db.vendors.find(x=>x.id===id);v.docs.push({name:file.name,date:iso(new Date())});save();openProfile(id);}

function attendanceBadge(s){let x=s||'pendiente';let cls=x==='presente'?'attended':x==='ausente'?'absent':'pend';return `<span class="badge ${cls}">${esc(x)}</span>`;}
function statusBadge(s){let x=s||'pendiente';let cls=x==='realizada'?'done':x==='suspendida'?'susp':'pend';return `<span class="badge ${cls}">${esc(x)}</span>`;}

function fairs(){
 const list=db.fairs.sort((a,b)=>a.date.localeCompare(b.date));
 return `<div class="top"><div class="title"><h1>Ferias</h1><p>Programación, feriantes participantes, pagos y estado de cada fecha</p></div><button class="btn" onclick="openFair()">+ Nueva feria</button></div>
 <div class="toolbar"><button class="btn alt" onclick="exportActiveFairsMonthPDF()">📄 PDF ferias activas del mes</button></div>
 <div class="tablewrap"><table><thead><tr><th>Fecha</th><th>Feria</th><th>Horario</th><th>Participantes</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>${list.map(f=>`<tr><td>${fmtDate(f.date)}</td><td><span class="badge ${f.type==='Euca'?'euca':'plate'}">${esc(f.type)}</span></td><td>${esc(f.time)}</td><td>${(f.participants||[]).length}</td><td>${statusBadge(f.status)}</td><td><button class="btn small alt" onclick="openFairDetail('${f.id}')">Gestionar</button> <button class="btn small alt" onclick="setFairStatus('${f.id}','realizada')">✓ Realizada</button> <button class="btn small" style="background:var(--red)" onclick="setFairStatus('${f.id}','suspendida')">✕ Suspendida</button></td></tr>`).join('')||'<tr><td colspan="6" class="muted">No hay fechas cargadas.</td></tr>'}</tbody></table></div>`;

}
function openFair(){
 document.getElementById('modalbox').innerHTML=`<h2>Nueva feria</h2><form onsubmit="saveFair(event)"><div class="formgrid"><div class="field"><label>Feria</label><select class="input" name="type"><option>Euca</option><option>Plate</option></select></div><div class="field"><label>Fecha</label><input required class="input" type="date" name="date"></div><div class="field full"><label>Horario</label><input required class="input" name="time" value="14:00 a 19:00"></div></div><div class="actions"><button type="button" class="btn alt" onclick="closeModal()">Cancelar</button><button class="btn">Guardar</button></div></form>`;
 document.getElementById('modal').classList.add('show');
}
function saveFair(e){e.preventDefault();let f=new FormData(e.target);db.fairs.push({id:crypto.randomUUID(),type:f.get('type'),date:f.get('date'),time:f.get('time'),status:'pendiente',participants:[]});save();closeModal();render();}
function openFairDetail(id){
 const f=db.fairs.find(x=>x.id===id);if(!f)return;f.participants=f.participants||[];if(f.price==null)f.price=8000;
 const rows=f.participants.map((p,i)=>{const v=db.vendors.find(x=>x.id===p.vendorId)||{};return `<tr><td><b>${esc(v.name||'Feriante eliminado')}</b><br><span class="muted">${esc(v.business||'')}</span></td><td>${p.paid?'Sí':'No'}</td><td>${p.paid?money(p.amount):'-'}</td><td>${attendanceBadge(p.attendance)}</td><td>${p.creditApplied?'Saldo a favor aplicado':'-'}</td><td><button class="btn small alt" onclick="toggleParticipantPaid('${id}',${i})">${p.paid?'Quitar pago':'Marcar abonado'}</button> <button class="btn small alt" onclick="setAttendance('${id}',${i})">Asistencia</button> <button class="btn small red" onclick="removeParticipant('${id}',${i})">Quitar</button></td></tr>`}).join('')||'<tr><td colspan="6" class="muted">Todavía no hay feriantes asignados.</td></tr>';
 const options=db.vendors.filter(v=>!f.participants.some(p=>p.vendorId===v.id)).map(v=>`<option value="${v.id}">${esc(v.name)} · ${esc(v.business)}</option>`).join('');
 document.getElementById('modalbox').innerHTML=`<div class="top"><div><h2 style="margin:0">${esc(f.type)} · ${fmtDate(f.date)}</h2><p class="muted">${esc(f.time)}</p></div><button class="btn alt" onclick="closeModal()">Cerrar</button></div>
 <div class="fairsummary"><span class="badge ${f.type==='Euca'?'euca':'plate'}">${esc(f.type)}</span>${statusBadge(f.status)}<span class="badge pend">${f.participants.length} participantes</span></div>
 <div class="toolbar"><select id="participantVendor" class="input"><option value="">Seleccionar feriante…</option>${options}</select><button class="btn small" onclick="addParticipant('${id}')">+ Agregar</button></div>
 <div class="notice">Valor del puesto para esta feria: <b>${money(f.price||8000)}</b> · <button class="btn small alt" onclick="editFairPrice('${id}')">Editar monto</button></div>
 <div class="tablewrap"><table><tr><th>Feriante</th><th>Abonó</th><th>Monto</th><th>Asistencia</th><th>Saldo</th><th></th></tr>${rows}</table></div>
 <div class="actions"><button class="btn alt" onclick="setFairStatus('${id}','realizada');openFairDetail('${id}')">✓ Marcar realizada</button><button class="btn red" onclick="setFairStatus('${id}','suspendida');openFairDetail('${id}')">✕ Suspender y generar saldos</button></div>
 <p class="creditnote">Al suspender una feria, los participantes que figuren como abonados reciben automáticamente ese importe como saldo a favor, una sola vez.</p>`;
 document.getElementById('modal').classList.add('show');
}
function addParticipant(fairId){const vendorId=document.getElementById('participantVendor').value;if(!vendorId)return alert('Seleccioná un feriante.');const f=db.fairs.find(x=>x.id===fairId);f.participants=f.participants||[];f.participants.push({vendorId,paid:false,amount:0,creditApplied:false,attendance:'pendiente'});save();openFairDetail(fairId);}
function setAttendance(fairId,i){const f=db.fairs.find(x=>x.id===fairId),p=f.participants[i];let status=prompt('Asistencia: presente / ausente / pendiente',p.attendance||'pendiente');if(!status)return;status=status.toLowerCase().trim();if(!['presente','ausente','pendiente'].includes(status))return alert('Estado inválido.');p.attendance=status;save();openFairDetail(fairId);}
function removeParticipant(fairId,i){const f=db.fairs.find(x=>x.id===fairId);f.participants.splice(i,1);save();openFairDetail(fairId);}
function editFairPrice(fairId){const f=db.fairs.find(x=>x.id===fairId);let amount=prompt('Valor del puesto para esta feria:',f.price??8000);if(amount===null)return;amount=Number(String(amount).replace(/[^0-9,.-]/g,'').replace(',','.'));if(!isFinite(amount)||amount<0)return alert('Monto inválido');f.price=amount;save();openFairDetail(fairId);}
function toggleParticipantPaid(fairId,i){const f=db.fairs.find(x=>x.id===fairId),p=f.participants[i];if(!p.paid){let amount=prompt('Monto abonado:',p.amount||f.price||8000);if(amount===null)return;amount=Number(String(amount).replace(/[^0-9,.-]/g,'').replace(',','.'));if(!isFinite(amount)||amount<0)return alert('Monto inválido.');p.paid=true;p.amount=amount;}else{p.paid=false;p.amount=0;p.creditApplied=false;}save();openFairDetail(fairId);}
function setFairStatus(id,status){
 let f=db.fairs.find(x=>x.id===id);if(!f)return;f.participants=f.participants||[];
 if(status==='suspendida'&&f.status!=='suspendida'){
  f.participants.forEach(p=>{if(p.paid&&!p.creditApplied){const v=db.vendors.find(x=>x.id===p.vendorId);if(v){v.balance=Number(v.balance||0)+Number(p.amount||0);v.payments=v.payments||[];v.payments.push({date:iso(new Date()),amount:Number(p.amount||0),note:`Saldo a favor · ${f.type} ${fmtDate(f.date)} suspendida`,credit:true});p.creditApplied=true;}}});
 }
 f.status=status;save();render();
}

function exportActiveFairsMonthPDF(){
 const y=month.getFullYear(),m=month.getMonth();
 const active=db.fairs.filter(f=>{const d=new Date(f.date+'T00:00:00');return d.getFullYear()===y&&d.getMonth()===m&&f.status!=='suspendida';}).sort((a,b)=>a.date.localeCompare(b.date));
 if(!active.length)return alert('No hay ferias activas en el mes seleccionado del calendario.');
 const body=active.map(f=>`<section><h2>${esc(f.type)} · ${fmtDate(f.date)} · ${esc(f.time)}</h2><table><tr><th>Feriante</th><th>Emprendimiento</th><th>Celular</th><th>Instagram</th><th>Asistencia</th></tr>${(f.participants||[]).map(p=>{const v=db.vendors.find(x=>x.id===p.vendorId)||{};return `<tr><td>${esc(v.name||'Feriante eliminado')}</td><td>${esc(v.business||'-')}</td><td>${esc(v.phone||'-')}</td><td>${esc(v.instagram||'-')}</td><td>${esc(p.attendance||'pendiente')}</td></tr>`}).join('')||'<tr><td colspan="5">Sin participantes cargados.</td></tr>'}</table></section>`).join('');
 const label=new Intl.DateTimeFormat('es-AR',{month:'long',year:'numeric'}).format(month);
 const w=window.open('','_blank');
 w.document.write(`<html><head><title>Ferias activas ${label}</title><style>body{font-family:Arial;padding:25px}section{page-break-inside:avoid;margin-bottom:24px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ccc;padding:7px;text-align:left;font-size:12px}th{background:#eee}</style></head><body><h1>Ferias activas · ${label}</h1><p>Generado: ${new Date().toLocaleString('es-AR')}</p>${body}<script>window.onload=()=>window.print()<\/script></body></html>`);
 w.document.close();
}

function generateSchedule(){
 let start=new Date(2026,7,20), end=new Date(2026,11,31);
 let existing=new Set(db.fairs.map(f=>f.date+'|'+f.type));
 for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)){
  let dow=d.getDay(), date=iso(d);
  if(dow===0 && !existing.has(date+'|Plate'))db.fairs.push({id:crypto.randomUUID(),type:'Plate',date,time:'14:00 a 19:00',status:'pendiente',participants:[]});
  if((dow===4||dow===5||(dow===6&&date>='2026-08-29'))&&!existing.has(date+'|Euca'))db.fairs.push({id:crypto.randomUUID(),type:'Euca',date,time:'11:00 a 19:00',status:'pendiente',participants:[]});
 }
 save();render();
}
function modules(){
 const fairs=db.fairs.slice().sort((a,b)=>a.date.localeCompare(b.date));
 return `<div class="top"><div class="title"><h1>Organización de módulos</h1><p>Arrastrá los feriantes entre puestos y módulos para reorganizar visualmente cada feria.</p></div></div>
 <div class="toolbar"><select id="moduleFair" class="input" onchange="selectedModuleFair=this.value;render()"><option value="">Seleccionar feria…</option>${fairs.map(f=>`<option value="${f.id}" ${selectedModuleFair===f.id?'selected':''}>${esc(f.type)} · ${fmtDate(f.date)}</option>`).join('')}</select></div>
 ${selectedModuleFair?moduleBoard(selectedModuleFair):'<div class="notice">Elegí una feria para organizar sus puestos.</div>'}`;
}
let selectedModuleFair='';
function moduleBoard(fairId){
 const f=db.fairs.find(x=>x.id===fairId);if(!f)return '';
 f.modules=f.modules||[];
 if(!f.modules.length)f.modules.push({id:crypto.randomUUID(),size:5,slots:Array(5).fill(null)});
 return `<div class="toolbar"><button class="btn" onclick="addModule('${fairId}')">+ Agregar módulo</button><button class="btn alt" onclick="autoAssignModules('${fairId}')">Distribuir participantes</button></div><div class="module-board">${f.modules.map((m,mi)=>`<div class="module" ondragover="event.preventDefault();this.classList.add('dragover')" ondragleave="this.classList.remove('dragover')" ondrop="dropSlot(event,'${fairId}',${mi})"><div class="modulehead"><b>Módulo ${mi+1}</b><button class="btn small red" onclick="deleteModule('${fairId}',${mi})">Eliminar</button></div><div class="moduletools"><label class="muted">Puestos:</label><input class="input" style="width:75px" type="number" min="1" value="${m.size}" onchange="resizeModule('${fairId}',${mi},this.value)"></div><div class="slots" style="grid-template-columns:repeat(${Math.min(m.size,5)},1fr)">${m.slots.map((vendorId,si)=>{const v=db.vendors.find(x=>x.id===vendorId);return `<div class="slot ${v?'':'empty'}" draggable="${v?'true':'false'}" ondragstart="dragSlot(event,'${fairId}',${mi},${si})" onclick="assignSlot('${fairId}',${mi},${si})">${v?`<b>${esc(v.name)}</b><span>${esc(v.business)}</span>`:'+ Asignar puesto'}</div>`}).join('')}</div></div>`).join('')}</div>`;
}
let draggedSlot=null;
function dragSlot(e,fairId,mi,si){draggedSlot={fairId,mi,si};e.target.classList.add('dragging');}
function dropSlot(e,fairId,targetMi){e.preventDefault();if(!draggedSlot)return;const f=db.fairs.find(x=>x.id===fairId),from=f.modules[draggedSlot.mi],to=f.modules[targetMi];const vendorId=from.slots[draggedSlot.si];let target=to.slots.findIndex(x=>!x);if(target<0){alert('Este módulo está completo.');return;}from.slots[draggedSlot.si]=null;to.slots[target]=vendorId;draggedSlot=null;save();render();}
function assignSlot(fairId,mi,si){const f=db.fairs.find(x=>x.id===fairId),m=f.modules[mi];if(m.slots[si]){if(confirm('¿Quitar este feriante del puesto?')){m.slots[si]=null;save();render();}return;}const assigned=f.modules.flatMap(x=>x.slots).filter(Boolean);const available=(f.participants||[]).map(p=>p.vendorId).filter(id=>!assigned.includes(id));if(!available.length)return alert('No hay participantes disponibles. Agregalos primero desde Gestionar feria.');const opts=available.map((id,i)=>{const v=db.vendors.find(x=>x.id===id);return `${i+1}. ${v.name} · ${v.business}`}).join('\\n');let n=prompt('Elegí el número del feriante:\\n'+opts);n=Number(n)-1;if(available[n]){m.slots[si]=available[n];save();render();}}
function addModule(fairId){const f=db.fairs.find(x=>x.id===fairId);f.modules=f.modules||[];f.modules.push({id:crypto.randomUUID(),size:5,slots:Array(5).fill(null)});save();render();}
function deleteModule(fairId,mi){const f=db.fairs.find(x=>x.id===fairId);if(!confirm('¿Eliminar este módulo?'))return;f.modules.splice(mi,1);save();render();}
function resizeModule(fairId,mi,size){size=Math.max(1,Number(size)||5);const m=db.fairs.find(x=>x.id===fairId).modules[mi];m.size=size;if(m.slots.length<size)m.slots.push(...Array(size-m.slots.length).fill(null));else m.slots=m.slots.slice(0,size);save();render();}
function autoAssignModules(fairId){const f=db.fairs.find(x=>x.id===fairId);const ids=(f.participants||[]).map(p=>p.vendorId);f.modules=f.modules||[];f.modules.forEach(m=>m.slots=Array(m.size).fill(null));let i=0;for(const m of f.modules){for(let j=0;j<m.size&&i<ids.length;j++)m.slots[j]=ids[i++];}while(i<ids.length){const slots=Array(5).fill(null);for(let j=0;j<5&&i<ids.length;j++)slots[j]=ids[i++];f.modules.push({id:crypto.randomUUID(),size:5,slots});}save();render();}
function calendar(){
 let y=month.getFullYear(),m=month.getMonth(), first=new Date(y,m,1), last=new Date(y,m+1,0);
 let cells=[];for(let i=0;i<first.getDay();i++)cells.push('<div></div>');
 for(let d=1;d<=last.getDate();d++){let date=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;let fs=db.fairs.filter(f=>f.date===date);cells.push(`<div class="day"><div class="daynum">${d}</div>${fs.map(f=>`<div class="event ${f.type==='Euca'?'e':'p'}"><b>${f.type}</b><br>${f.time}<br>${statusBadge(f.status)}</div>`).join('')}</div>`)}
 return `<div class="top"><div class="title"><h1>Calendario</h1><p>${new Intl.DateTimeFormat('es-AR',{month:'long',year:'numeric'}).format(month)}</p></div><div><button class="btn alt" onclick="month.setMonth(month.getMonth()-1);render()">‹</button> <button class="btn alt" onclick="month.setMonth(month.getMonth()+1);render()">›</button> <button class="btn" onclick="generateSchedule()">Generar calendario base</button></div></div>
 <div class="calendar"><div class="calhead">Dom</div><div class="calhead">Lun</div><div class="calhead">Mar</div><div class="calhead">Mié</div><div class="calhead">Jue</div><div class="calhead">Vie</div><div class="calhead">Sáb</div>${cells.join('')}</div>`;
}
function closeModal(){document.getElementById('modal').classList.remove('show');}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>show(b.dataset.view));
render();
</script>
</body></html>
